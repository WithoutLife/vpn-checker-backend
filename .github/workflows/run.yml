name: Run VPN Checker

on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа
  workflow_dispatch: # Кнопка для запуска вручную

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests websocket-client

    - name: Run checker script
      run: python checker.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add checked/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление ключей" && git push)
